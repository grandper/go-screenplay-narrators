name: Golang Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gotest:
    runs-on: ubuntu-latest

    # Every adapter is its own Go module: each one is tested on its own.
    strategy:
      fail-fast: false
      matrix:
        module: [ awsadapter, godogadapter, logrusadapter, testingadapter, zapadapter, zerologadapter ]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests with coverage
        run: |
          go test -v -count 3 -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out
