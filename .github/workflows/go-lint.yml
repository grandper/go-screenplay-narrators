name: Golang Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  golint:
    runs-on: ubuntu-latest

    # Every adapter is its own Go module: each one is linted on its own.
    strategy:
      fail-fast: false
      matrix:
        module: [ awsadapter, godogadapter, logrusadapter, testingadapter, zapadapter, zerologadapter ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # golangci-lint must be built with the Go version the module targets: a
      # prebuilt binary compiled with an older Go refuses to load the module.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: ${{ matrix.module }}
